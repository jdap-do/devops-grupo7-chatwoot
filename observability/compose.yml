name: devops-grupo7-observability
services:
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.0}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3005}:3000"
    networks:
      - chatwoot
    restart: unless-stopped
  resource-exporter:
    image: python:3.12.12-slim
    user: '10001:10001'
    command: [python, /app/resource_exporter.py]
    volumes:
      - ./instrumentation/resource_exporter.py:/app/resource_exporter.py:ro
      - ./.runtime:/data:ro
    networks:
      - chatwoot
    restart: unless-stopped
  dependency-prober:
    build:
      context: ./instrumentation
      dockerfile: Dockerfile.prober
    image: devops-grupo7/dependency-prober:contract-v1
    env_file:
      - path: .env.prober
        required: false
        format: raw
    environment:
      PROJECT: devops-grupo7
      ENVIRONMENT: lab
    networks:
      - chatwoot
    restart: unless-stopped
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/adapters:/etc/prometheus/adapters:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - chatwoot
    restart: unless-stopped
  http-gateway:
    build: ./instrumentation
    image: devops-grupo7/http-gateway:contract-v1
    environment:
      UPSTREAM_URL: ${CHATWOOT_UPSTREAM_URL:-http://devops-grupo7-e2-rails:3000}
      PROJECT: devops-grupo7
      ENVIRONMENT: lab
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3011}:8080"
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9101}:9100"
    networks:
      - chatwoot
    restart: unless-stopped
networks:
  chatwoot:
    external: true
    name: ${CHATWOOT_NETWORK:-devops-grupo7-e2-network}
volumes:
  prometheus_data:
  grafana_data:
secrets:
  grafana_admin_password:
    file: ./.runtime/grafana-admin-password.txt
