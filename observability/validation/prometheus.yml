global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: chatwoot-http
    metrics_path: /metrics/http
    static_configs:
      - targets: [synthetic-metrics:8000]
        labels:
          project: devops-grupo7
          environment: lab
  - job_name: chatwoot-dependencies
    metrics_path: /metrics/dependencies
    static_configs:
      - targets: [synthetic-metrics:8000]
        labels:
          project: devops-grupo7
          environment: lab
  - job_name: chatwoot-resources
    metrics_path: /metrics/resources
    static_configs:
      - targets: [synthetic-metrics:8000]
        labels:
          project: devops-grupo7
          environment: lab
