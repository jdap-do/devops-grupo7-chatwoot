name: devops-grupo7-sre-validation

services:
  notification-receiver:
    image: devops-grupo7/notification-receiver:contract-v3
    build:
      context: ./notification-receiver
    ports:
      - "127.0.0.1:${VALIDATION_RECEIVER_PORT:-18093}:8080"
    volumes:
      - notifications-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${VALIDATION_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - notification-receiver

  synthetic-metrics:
    image: devops-grupo7/synthetic-metrics:contract-v3
    build:
      context: ./synthetic-metrics
    ports:
      - "127.0.0.1:${VALIDATION_METRICS_PORT:-18091}:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.path=/prometheus/data
    ports:
      - "127.0.0.1:${VALIDATION_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - synthetic-metrics
      - alertmanager

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${VALIDATION_GRAFANA_PORT:-13005}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  alertmanager-data:
  notifications-data:
  prometheus-data:
  grafana-data:
