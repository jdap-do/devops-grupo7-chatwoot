global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/adapters/*.yml

scrape_configs:
  - job_name: chatwoot-resources
    static_configs:
      - targets: [resource-exporter:9100]
        labels:
          project: devops-grupo7
          environment: lab
  - job_name: chatwoot-dependencies
    metric_relabel_configs:
      - source_labels: [__name__, le]
        regex: 'unal_dependency_probe_duration_seconds_bucket;1\.0'
        target_label: le
        replacement: '1'
    static_configs:
      - targets: [dependency-prober:9100]
        labels:
          project: devops-grupo7
          environment: lab
  - job_name: chatwoot-http
    metric_relabel_configs:
      - source_labels: [__name__, le]
        regex: 'unal_chatwoot_http_request_duration_seconds_bucket;1\.0'
        target_label: le
        replacement: '1'
    static_configs:
      - targets: [http-gateway:9100]
        labels:
          project: devops-grupo7
          environment: lab
