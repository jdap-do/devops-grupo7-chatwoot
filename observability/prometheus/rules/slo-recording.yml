        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",status_class="2xx",availability_result="good"}[30m]
      ))
    labels:
      slo: latency
      window: 30m
  - record: unal_chatwoot:slo_bad_requests:increase
    expr: |-
