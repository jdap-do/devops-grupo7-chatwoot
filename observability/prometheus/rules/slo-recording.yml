        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",status_class="2xx",availability_result="good"}[30d]
      ))
    labels:
      slo: latency
      window: 30d
  - record: unal_chatwoot:slo_bad_requests:increase
    expr: |-
      sum by (project, environment) (increase(
        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",status_class="2xx",availability_result="good"}[30d]
      ))
      -
      sum by (project, environment) (increase(
        unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",status_class="2xx",availability_result="good",le="0.5"}[30d]
      ))
    labels:
      slo: latency
      window: 30d
  - record: unal_chatwoot:slo_error:ratio
    expr: |-
      (
        unal_chatwoot:slo_bad_requests:increase
        / unal_chatwoot:slo_eligible_requests:increase
      )
      and on (project, environment, slo, window)
      (unal_chatwoot:slo_eligible_requests:increase > 0)
      and on (project, environment)
      (unal_chatwoot:http_telemetry_valid:ratio == 1)
  - record: unal_chatwoot:slo_sli:ratio
    expr: 1 - unal_chatwoot:slo_error:ratio
  - record: unal_chatwoot:slo_burn_rate:ratio
    expr: |-
      unal_chatwoot:slo_error:ratio
      / on (project, environment, slo) group_left
      unal_chatwoot:slo_error_budget:ratio
  - record: unal_chatwoot:slo_budget_consumed:ratio
    expr: unal_chatwoot:slo_burn_rate:ratio{window="30d"}
  - record: unal_chatwoot:slo_budget_remaining:ratio
    expr: 1 - unal_chatwoot:slo_budget_consumed:ratio
  - record: unal_chatwoot:http_request_duration:p95_seconds
    expr: |-
      histogram_quantile(0.95,
        sum by (project, environment, le) (rate(
          unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="good"}[5m]
        ))
      )
      and on (project, environment)
      (sum by (project, environment) (rate(
        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="good"}[5m]
      )) > 0)
      and on (project, environment)
      (unal_chatwoot:http_telemetry_valid:ratio == 1)
    labels:
      availability_result: good
      window: 5m
  - record: unal_chatwoot:http_request_duration:p95_seconds
    expr: |-
      histogram_quantile(0.95,
        sum by (project, environment, le) (rate(
          unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="bad"}[5m]
        ))
      )
      and on (project, environment)
      (sum by (project, environment) (rate(
        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="bad"}[5m]
      )) > 0)
      and on (project, environment)
      (unal_chatwoot:http_telemetry_valid:ratio == 1)
    labels:
      availability_result: bad
      window: 5m
  - record: unal_chatwoot:http_request_duration:p95_seconds
    expr: |-
      histogram_quantile(0.95,
        sum by (project, environment, le) (increase(
          unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="good"}[30d]
        ))
      )
      and on (project, environment)
      (sum by (project, environment) (increase(
        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",availability_result="good"}[30d]
      )) > 0)
      and on (project, environment)
      (unal_chatwoot:http_telemetry_valid:ratio == 1)
    labels:
