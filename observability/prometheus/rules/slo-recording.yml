  - record: unal_chatwoot:slo_eligible_requests:increase
    expr: |-
      sum by (project, environment) (increase(
        unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",status_class="2xx",availability_result="good"}[6h]
      ))
    labels:
