# Synthetic inputs only; no Chatwoot or dependency credentials are required.
rule_files:
- ../rules/slo-recording.yml
evaluation_interval: 15s
fuzzy_compare: true
tests:
- name: healthy requests leave both budgets intact
  interval: 1m
  input_series:
  - series: up{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a"}
    values: 1+0x20
  - series: unal_chatwoot_http_requests_total{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_count{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="0.05"}
    values: 0+0x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="0.1"}
    values: 0+0x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="0.25"}
    values: 0+0x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="0.5"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="1"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="2.5"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="5"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="10"}
    values: 0+100x20
  - series: unal_chatwoot_http_request_duration_seconds_bucket{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="2xx",availability_result="good",le="+Inf"}
    values: 0+100x20
  - series: unal_chatwoot_http_requests_total{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="5xx",availability_result="bad"}
    values: 0+0x20
  - series: unal_chatwoot_http_requests_total{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="4xx",availability_result="bad"}
    values: 0+0x20
  - series: unal_chatwoot_http_requests_total{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="4xx",availability_result="excluded"}
    values: 0+0x20
  - series: unal_chatwoot_http_requests_total{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a",method="GET",status_class="3xx",availability_result="excluded"}
    values: 0+0x20
  promql_expr_test:
  - expr: unal_chatwoot:slo_sli:ratio{slo="availability",window="5m"}
    eval_time: 5m
    exp_samples:
    - labels: '{project="devops-grupo7",environment="lab",slo="availability",__name__="unal_chatwoot:slo_sli:ratio",window="5m"}'
      value: 1
  - expr: unal_chatwoot:slo_sli:ratio{slo="latency",window="5m"}
    eval_time: 5m
    exp_samples:
    - labels: '{project="devops-grupo7",environment="lab",slo="latency",__name__="unal_chatwoot:slo_sli:ratio",window="5m"}'
      value: 1
  - expr: round(unal_chatwoot:slo_budget_remaining:ratio{slo="availability"}, 0.000001)
    eval_time: 5m
    exp_samples:
    - labels: '{project="devops-grupo7",environment="lab",slo="availability",window="30d"}'
      value: 1
  - expr: round(unal_chatwoot:slo_budget_remaining:ratio{slo="latency"}, 0.000001)
    eval_time: 5m
    exp_samples:
    - labels: '{project="devops-grupo7",environment="lab",slo="latency",window="30d"}'
      value: 1
