    values: 1+0x40
  - series: unal_container_memory_working_set_bytes{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-resources",component="redis"}
    values: 1+0x40
  - series: unal_chatwoot:slo_burn_rate:ratio{project="devops-grupo7",environment="lab",slo="availability",window="1h"}
    values: 15+0x40
  - series: unal_chatwoot:slo_burn_rate:ratio{project="devops-grupo7",environment="lab",slo="availability",window="5m"}
    values: 15+0x40
  alert_rule_test:
  - eval_time: 15s
    alertname: ChatwootAvailabilityBudgetBurn
    exp_alerts:
    - exp_labels:
        project: devops-grupo7
        environment: lab
        slo: availability
        severity: page
      exp_annotations:
        summary: Consumo acelerado del presupuesto de disponibilidad
        description: Ambas ventanas del par superan su burn rate. Revisar el impacto, los eventos elegibles y el presupuesto restante.
        dashboard_uid: chatwoot-sre-unal
        next_action: Pausar cambios no relacionados y revisar el servicio.
  - eval_time: 15s
