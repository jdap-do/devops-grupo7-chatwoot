    values: 1+0x40
  - series: unal_dependency_probe_duration_seconds_count{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-dependencies",dependency="redis"}
    values: 1+0x40
  - series: unal_postgres_transactions_total{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-dependencies"}
    values: 1+0x40
  - series: unal_redis_commands_processed_total{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-dependencies"}
    values: 1+0x40
  - series: unal_postgres_connections{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-dependencies"}
    values: 1+0x40
  - series: unal_postgres_max_connections{project="devops-grupo7",environment="lab",instance="fixture",job="chatwoot-dependencies"}
    values: 1+0x40
