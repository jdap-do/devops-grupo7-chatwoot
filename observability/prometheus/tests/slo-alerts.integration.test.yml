rule_files:
- ../rules/slo-recording.yml
- ../rules/slo-alerts.yml
evaluation_interval: 15s
fuzzy_compare: true
group_eval_order:
- chatwoot-slo-recording
- chatwoot-slo-alerts
tests:
- name: zero traffic is not 100 percent availability
  interval: 1m
  input_series:
  - series: up{project="devops-grupo7",environment="lab",job="chatwoot-http",instance="gateway-a"}
    values: 1+0x20
