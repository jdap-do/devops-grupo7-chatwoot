# PostgreSQL, Redis y sus volumenes permanecen en el proyecto original.
x-app: &app
  image: ${CHATWOOT_IMAGE:?Use an immutable image digest}
  env_file: /srv/chatwoot/config/app.env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: 'true'
    POSTGRES_HOST: devops-grupo7-gcp-postgres-1
    POSTGRES_PORT: '5432'
    POSTGRES_DATABASE: chatwoot_production
    POSTGRES_USERNAME: postgres
    REDIS_URL: redis://devops-grupo7-gcp-redis-1:6379
    ACTIVE_STORAGE_SERVICE: local
    WEB_CONCURRENCY: '0'
    RAILS_MAX_THREADS: '5'
    SIDEKIQ_CONCURRENCY: '5'
  volumes:
    - storage:/app/storage
    - /srv/chatwoot/cd/demo-gcp.html:/app/public/demo-gcp.html:ro
  networks: [chatwoot]
  restart: unless-stopped
  stop_grace_period: 60s
services:
  rails:
    <<: *app
    entrypoint: [bundle, exec, rails]
    command: [s, -p, '3000', -b, 0.0.0.0]
    ports: ['127.0.0.1:${SLOT_PORT:?Set slot port}:3000']
    mem_limit: 1536m
  sidekiq:
    <<: *app
    entrypoint: [bundle, exec, sidekiq]
    command: [-C, config/sidekiq.yml]
    mem_limit: 1024m
networks:
  chatwoot:
    external: true
    name: devops-grupo7-gcp-network
volumes:
  storage:
    external: true
    name: devops-grupo7-gcp_storage_data
