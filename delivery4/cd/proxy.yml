name: devops-grupo7-cd
services:
  router:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: grupo7-router
    ports: ['127.0.0.1:3001:8080']
    volumes:
      - /srv/chatwoot/cd/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/chatwoot/cd/routes:/etc/nginx/conf.d:ro
    networks: [chatwoot]
    restart: unless-stopped
    mem_limit: 128m
networks:
  chatwoot:
    external: true
    name: devops-grupo7-gcp-network
