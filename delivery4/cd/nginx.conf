worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  # Chatwoot autentica su API con api_access_token; conservar esa cabecera.
  underscores_in_headers on;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No registrar URLs de la demo que pueden contener el token publico del widget.
  access_log off;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $original_scheme { default $http_x_forwarded_proto; '' $scheme; }
  include /etc/nginx/conf.d/*.conf;
}
