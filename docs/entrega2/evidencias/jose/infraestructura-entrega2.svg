="#183047">PostgreSQL y Redis</text><text x="100" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#183047">Volúmenes nombrados · administrados por persistence</text><rect x="100" y="1140" width="420" height="140" rx="14" fill="#fff7e8" stroke="#d8ba7c" stroke-width="2"/><text x="117" y="1180" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183047">storage-data</text><text x="117" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">Rails, Sidekiq y prepare</text><text x="117" y="1255" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#183047">/app/storage</text><rect x="540" y="1140" width="420" height="140" rx="14" fill="#fff7e8" stroke="#d8ba7c" stroke-width="2"/><text x="557" y="1180" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183047">postgres-data</text><text x="557" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">PostgreSQL</text><text x="557" y="1255" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#183047">/var/lib/postgresql/data</text><rect x="980" y="1140" width="420" height="140" rx="14" fill="#fff7e8" stroke="#d8ba7c" stroke-width="2"/><text x="997" y="1180" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183047">redis-data</text><text x="997" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">Redis · AOF habilitado</text><text x="997" y="1255" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#183047">/data</text><text x="100" y="1323" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#183047">Los tres nombres llevan el prefijo devops-grupo7-e2-.</text><rect x="60" y="1395" width="1380" height="130" rx="14" fill="#f7f4fc" stroke="#b3c3d3" stroke-width="2"/><text 