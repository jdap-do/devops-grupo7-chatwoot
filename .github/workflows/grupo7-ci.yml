name: Grupo 7 - CI y publicacion

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grupo7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 1. Validacion estatica de sintaxis y buenas practicas del Dockerfile y manifiestos.
      - name: Validar Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validar YAML
        run: |
          python -m pip install yamllint==1.35.1
          yamllint -c .yamllint-grupo7.yml .yamllint-grupo7.yml compose.entrega.yml .github/workflows/grupo7-ci.yml

      - name: Validar Compose sin secretos reales
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          cp .env.entrega.example .env
          docker compose -f compose.entrega.yml config --quiet

  build-scan:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 2. Construccion de la imagen de la aplicacion.
      - name: Definir nombre de imagen
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4

      - name: Construir sin publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=grupo7
          cache-to: type=gha,mode=max,scope=grupo7
      # 3. Escaneo estatico de vulnerabilidades de la imagen construida.

      - name: Informe completo de vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: false

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: warn

      - name: Bloquear vulnerabilidades criticas corregibles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      # 4. Publicacion automatica de la imagen escaneada en GHCR (solo pushes a main).
      - name: Autenticar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la misma imagen escaneada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          docker tag "$IMAGE:sha-$REVISION" "$IMAGE:4.18.0-grupo7"
          docker push "$IMAGE:4.18.0-grupo7"
          echo "Imagen publicada: $IMAGE:sha-$REVISION" >> "$GITHUB_STEP_SUMMARY"
